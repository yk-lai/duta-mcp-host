[project]
name = "duta-mcp-shared"
version = "0.1.0"
description = "Shared infrastructure for duta-mcp-host — structured logging and per-request context."
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["duta_mcp_shared*"]
